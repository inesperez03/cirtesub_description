    base_frame_id: cirtesub/base_link
    model_file: /home/cirtesu/cirtesub_ws/src/cirtesub_description/config/cirtesub_state_observer_model.yaml
    navigator_timeout: 0.5
    force_timeout: 0.5
    imu_timeout: 0.5
    aruco_pose_timeout: 0.5
    depth_pose_timeout: 0.5
    forgetting_factor: 0.9995
    min_excitation: 0.001
    initial_estimator_covariance: 10.0
